<Section class="chapter-section">

    <h2 id="heading">hello world</h2>

<button onclick="changetag()">changetag</button>
    
    <script>
        function changetag(){
            // get the existing heading element
            
            var heading = document.getElementById("heading");

            // create a new paragraph element

            var newParagraph = document.createElement("p");

            // set the content of the paragraph

            newParagraph.textContent = 
            "this is the new paragraph created dynamically.";

            // Replace the exxisting heading with the new paragraph

            heading.parentNode.replaceChild(newParagraph,heading);
        }
    </script>


</Section>

<Section class="grey">

    <img 
    id="myimage"
    width="500"
    src="gallery6 .jpg"
    alt="og image">
    
    <button onclick="changeAttributes()">change</button>

    <script>
        function changeAttributes(){
        // get the existing image element

        var image = document.getElementById("myimage");

        // change the src attribute

        image.src = "gallery10.jpg";

        //change the alt attribute

        image.alt = "New Image";
        }
    </script>
</Section>

<Section class="grey">

    <img 
    id="theimage"
    width="500"
    src="gallery6 .jpg"
    alt="og image">
    
    

    <script>
        document.addEventListener("DOMContentLoaded",function () {
        var image = document.getElementById("theimage");

        //Change image source on "Enter" key press

        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                image.src = "gallery8.jpg";
            }
        });
    });
    </script>
