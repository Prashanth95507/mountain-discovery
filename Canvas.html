        <canvas id="mycanvas" width="600" height="400"></canvas>
        <script>
            const canvas = document.getElementById("mycanvas"); //get the html canvas element
            const ctx = canvas.getContext("2d"); //get the 2d rendering context

            ctx.fillStyle = "green"; //set the fill style property of the drawing context
            ctx.fillRect(0, 0, 600, 400); //draw and fill the rectangle (fit to canvas height)

            //this javascript is to draw a circle
            ctx.fillStyle = "red";
            ctx.beginPath(); //start a new path 
            ctx.arc(100, 100, 40, 0, Math.PI * 2); //Draw a circle at (100,100) with radius 40
            ctx.fill(); //fill the circle with the current fill color

            //this code creates a gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);

            gradient.addColorStop(0, "blue"); //add color stop at the begining (0%)
            gradient.addColorStop(1, "red"); //add color stop at the end (100%)

            //fill rectangle with gradient
            ctx.fillStyle = gradient;
            ctx.fillRect(40, 150, canvas.width - 40, canvas.height - 150);

            //this piece of code allows for circles to appear when the area is clicked
            canvas.addEventListener("click", function (event) {
                const x = event.clientX - canvas.offsetLeft;
                const y = event.clientY - canvas.offsetTop;

                // Draw a circle where the user clicked
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, 2 * Math.PI);
                ctx.fillStyle = "orange";
                ctx.fill();
            });

            //we are setting isDrawing as the constant to say no drawing
            let isDrawing = false;
            //mousedown is an event so when the mouse is held down the drawing will appear

            canvas.addEventListener("mousedown", function (event) {
                isDrawing = true;
                draw(
                    event.clientX - canvas.offsetLeft,
                    event.clientY - canvas.offsetTop
                );
            });

            canvas.addEventListener("mousemove", function (event) {
                if (isDrawing) {
                    draw(
                        event.clientX - canvas.offsetLeft,
                        event.clientY - canvas.offsetTop
                    );
                }
            });

            canvas.addEventListener("mouseup", function () {
                isDrawing = false;
            });

            function draw(x, y) {
                ctx.fillStyle = "black";
                ctx.fillRect(x, y, 5, 5);
            }

            //create a new image object
            const img = new Image();
            //set source of the image
            img.src = "gallery6.jpg";

            //when the image loads
            img.onload = function () {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            //Add click event listener to spin the image
            // NOTE: Keep a single click handler if you want both behaviors; if not,
            // consider removing one to avoid conflicts. This handler rotates the image.
            canvas.addEventListener("click", function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const angle = 0;
                rotateImage(img, angle);
            });

            //Function to rotate image
            function rotateImage(image, angle) {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((angle * Math.PI) / 180);
                ctx.drawImage(
                    image,
                    -canvas.width / 2,
                    -canvas.height / 2,
                    canvas.width,
                    canvas.height
                );
                ctx.restore();

                //Increment angle for next rotation
                const newAngle = angle + 10;
                if (newAngle < 360) {
                    setTimeout(function () {
                        rotateImage(image, newAngle);
                    }, 100);
                }
            }
        </script>
